<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chemins du Soleil</title>
  <meta name="theme-color" content="#2E2E2E">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="images/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="images/icon-192.png">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body>

  <canvas id="blob-bg" aria-hidden="true"></canvas>

  <header class="app-header">
    <picture>
      <source srcset="images/logo_inv.png" media="(prefers-color-scheme: dark)">
      <img src="images/logo.png" alt="Chemins du Soleil">
    </picture>
    <span class="header-temp" aria-hidden="true"></span>
  </header>

  <section id="view-home" role="tabpanel" aria-labelledby="tab-home">
    <main class="app-main">

      <location-gate hidden></location-gate>

      <weather-hero></weather-hero>

      <form class="search-form" novalidate>

        <div class="form-row">
          <label id="lbl-start">From</label>
          <station-input
            name="start"
            aria-labelledby="lbl-start"
            placeholder="Start station…"
          ></station-input>
        </div>

        <div class="form-row">
          <label id="lbl-dest">To</label>
          <station-input
            name="destination"
            aria-labelledby="lbl-dest"
            placeholder="Destination…"
          ></station-input>
        </div>

        <div class="form-row">
          <label id="lbl-diff">Maximum difficulty</label>
          <difficulty-selector aria-labelledby="lbl-diff"></difficulty-selector>
        </div>

        <div class="form-row">
          <label id="lbl-pref">Preferred difficulty</label>
          <preference-selector aria-labelledby="lbl-pref"></preference-selector>
        </div>

        <p class="form-error" role="alert"></p>

        <button type="submit" class="btn-find">Find route</button>

      </form>

      <button type="button" class="search-summary" hidden>
        <span class="search-summary-text">
          <span class="search-summary-route"></span>
          <span class="search-summary-pref"></span>
        </span>
        <span class="search-summary-chevron" aria-hidden="true">⌄</span>
      </button>

      <route-result></route-result>

    </main>
  </section>

  <section id="view-resorts" role="tabpanel" aria-labelledby="tab-resorts" hidden>
    <main class="app-main">

      <h2 class="section-label">Portes du Soleil resorts</h2>
      <resort-conditions-list></resort-conditions-list>

    </main>
  </section>

  <section id="view-alerts" role="tabpanel" aria-labelledby="tab-alerts" hidden>
    <main class="app-main">

      <div class="alerts-content">
        <avalanche-banner></avalanche-banner>
      </div>

      <p class="alerts-empty" hidden>No active alerts.</p>

    </main>
  </section>

  <footer class="app-footer">
    <small>&copy; diekus 2026</small>
  </footer>

  <tab-bar></tab-bar>

  <script type="module" src="src/app.js"></script>
  <script type="module" src="src/blob-bg.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js');
    }
  </script>
</body>
</html>
