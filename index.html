<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title id="page-title">Chemins du Soleil</title>
  <!-- Mirrors --color-background in base.css, so the WCO title bar / window
       controls overlay matches the app header in light and dark. No
       unconditioned fallback tag — an always-matching tag ahead of these
       wins the browser's WCO colour pick regardless of the others' media,
       which is what silently broke this the first time round. -->
  <meta name="theme-color" content="#111111" media="(prefers-color-scheme: dark)" data-scheme="dark">
  <meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)" data-scheme="light">
  <!-- Applies the stored theme preference (Settings tab) before first paint,
       so a forced light/dark choice never flashes the system scheme. The
       runtime logic lives in src/theme.js; keep the two in sync. -->
  <script>
    try {
      var cdsTheme = localStorage.getItem('cds:theme');
      if (cdsTheme === 'light' || cdsTheme === 'dark') {
        document.documentElement.dataset.theme = cdsTheme;
        document.querySelectorAll('[data-scheme]').forEach(function (el) {
          el.media = el.dataset.scheme === cdsTheme ? 'all' : 'not all';
        });
      }
    } catch (e) { /* storage unavailable: follow the system scheme */ }
  </script>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="images/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="images/icon-192.png">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/foldable.css">
</head>
<body>

  <canvas id="blob-bg" aria-hidden="true"></canvas>

  <header class="app-header">
    <picture>
      <source srcset="images/logo_inv.png" media="(prefers-color-scheme: dark)" data-scheme="dark">
      <img src="images/logo.png" alt="Chemins du Soleil">
    </picture>
    <span class="header-temp" aria-hidden="true">
      <span class="header-temp-icon"></span>
      <span class="header-temp-value"></span>
    </span>
  </header>

  <section id="view-home" role="tabpanel" aria-labelledby="tab-home">
    <main class="app-main">

      <location-gate hidden></location-gate>

      <weather-hero></weather-hero>

      <div class="search-panel">

        <form class="search-form" novalidate>

          <swipe-panel id="search-mode" label-key="home.modeAriaLabel">

            <div data-swipe-page="route" data-label-key="home.modeRoute">
              <div class="form-row">
                <label id="lbl-start"></label>
                <station-input
                  name="start"
                  aria-labelledby="lbl-start"
                ></station-input>
              </div>

              <div class="form-row">
                <label id="lbl-dest"></label>
                <station-input
                  name="destination"
                  aria-labelledby="lbl-dest"
                ></station-input>
              </div>
            </div>

            <div data-swipe-page="meet" data-label-key="home.modeMeet">
              <div class="meet-incoming" hidden>
                <span class="meet-icon" aria-hidden="true"></span>
                <div class="meet-incoming-text">
                  <p class="meet-incoming-title" data-i18n="meet.incomingTitle"></p>
                  <p class="meet-incoming-meta"></p>
                  <p class="meet-incoming-hint"></p>
                </div>
                <button type="button" class="meet-dismiss" data-i18n="meet.dismiss"></button>
              </div>

              <!-- Sharing needs the Web Share API; app.js hides this where it's missing. -->
              <div class="meet-share">
                <p class="meet-explanation" data-i18n="meet.explanation"></p>
                <button type="button" class="meet-share-btn">
                  <span class="meet-icon" aria-hidden="true"></span>
                  <span data-i18n="meet.shareButton"></span>
                </button>
                <p class="meet-share-status" role="status" aria-live="polite"></p>
                <p class="meet-privacy" data-i18n="meet.privacyNote"></p>
              </div>
            </div>

          </swipe-panel>

          <div class="form-row route-option">
            <label id="lbl-diff"></label>
            <difficulty-selector aria-labelledby="lbl-diff"></difficulty-selector>
          </div>

          <div class="form-row route-option">
            <label id="lbl-pref"></label>
            <preference-selector aria-labelledby="lbl-pref"></preference-selector>
          </div>

          <p class="form-error" role="alert"></p>

          <button type="submit" class="btn-find route-option"></button>

        </form>

        <button type="button" class="search-summary" hidden>
          <span class="search-summary-text">
            <span class="search-summary-route"></span>
            <span class="search-summary-pref"></span>
          </span>
          <span class="chevron" aria-hidden="true"></span>
        </button>

      </div>

      <route-result></route-result>

    </main>
  </section>

  <section id="view-resorts" role="tabpanel" aria-labelledby="tab-resorts" hidden>
    <main class="app-main">

      <h2 class="section-label" data-i18n="resorts.title"></h2>
      <resort-conditions-list></resort-conditions-list>

    </main>
  </section>

  <section id="view-alerts" role="tabpanel" aria-labelledby="tab-alerts" hidden>
    <main class="app-main">

      <div class="alerts-content">
        <avalanche-banner></avalanche-banner>
      </div>

      <p class="alerts-empty" data-i18n="alerts.noActive" hidden></p>

      <h2 class="section-label" data-i18n="alerts.cautionsTitle"></h2>
      <p class="section-hint" data-i18n="alerts.cautionsHint"></p>

      <div class="cautions-content">
        <weather-caution-list></weather-caution-list>
      </div>

      <p class="cautions-empty" data-i18n="alerts.cautionsEmpty" hidden></p>

    </main>
  </section>

  <section id="view-route-detail" role="region" aria-label="Route details" hidden>
    <main class="app-main">

      <route-detail></route-detail>

    </main>
  </section>

  <section id="view-settings" role="tabpanel" aria-labelledby="tab-settings" hidden>
    <main class="app-main">

      <settings-panel></settings-panel>

    </main>
  </section>

  <footer class="app-footer">
    <small>&copy; diekus 2026 &middot; <a href="privacy.html" data-i18n="footer.privacyPolicy"></a></small>
  </footer>

  <tab-bar></tab-bar>

  <script type="module" src="src/app.js"></script>
  <script type="module" src="src/blob-bg.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js');
    }
  </script>
</body>
</html>
