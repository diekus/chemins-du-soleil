<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Offline — Chemins du Soleil</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #FFFFFF;
      --surface: #F7F7F7;
      --border: #E0E0E0;
      --text: #2E2E2E;
      --text-secondary: #6B6B6B;
      --accent: #BAF0FF;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #2E2E2E;
        --surface: #3A3A3A;
        --border: #4A4A4A;
        --text: #FFFFFF;
        --text-secondary: #BBBBBB;
        --accent: #5BC8E0;
      }
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, sans-serif;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 1rem;
      padding: 2.5rem 2rem;
      max-width: 22rem;
      width: 100%;
      text-align: center;
    }

    .icon {
      font-size: 3rem;
      line-height: 1;
      margin-bottom: 1.25rem;
    }

    h1 {
      font-size: 1.25rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
    }

    p {
      color: var(--text-secondary);
      font-size: 0.9375rem;
      line-height: 1.5;
      margin-bottom: 1.5rem;
    }

    button {
      background: var(--text);
      color: var(--bg);
      border: none;
      border-radius: 0.5rem;
      padding: 0.75rem 1.5rem;
      font-size: 0.9375rem;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
    }

    button:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }
  </style>
</head>
<body>
  <div class="card" role="main">
    <div class="icon" aria-hidden="true">🏔️</div>
    <h1>You're offline</h1>
    <p>Open the app once with a connection to cache the resort data, then route-finding works anywhere on the mountain.</p>
    <button onclick="window.location.reload()">Try again</button>
  </div>
</body>
</html>
